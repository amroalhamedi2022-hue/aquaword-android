name: AquaWord Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'history/**'
      - 'branding/**'
      - 'quality/**'
      - 'templates/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
  workflow_dispatch:

# Avoid burning scarce private-repository runner minutes on superseded commits.
concurrency:
  group: aquaword-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overlay-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tool
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Generate AquaWord icons
        run: python3 scripts/make_icons.py
      - name: Create and validate four editable Word templates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'python-docx==1.2.0'
          python3 scripts/generate_templates.py
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from docx import Document
          paths=sorted(Path('templates/generated').glob('*.docx'))
          assert len(paths)==4, paths
          for path in paths:
              with ZipFile(path) as z:
                  assert z.testzip() is None
                  assert 'word/document.xml' in z.namelist()
              d=Document(path)
              assert len(d.paragraphs) >= 8, path
              assert any(p.style.name.startswith('Heading') for p in d.paragraphs),path
              print(path, len(d.paragraphs), 'paragraphs')
          PY
      - name: Run native Android focus-mode behavior tests
        shell: bash
        run: |
          set -euo pipefail
          node --check branding/focus_mode.js
          node tests/test_focus_mode.cjs
      - name: Generate mandatory honest feature comparison report
        shell: bash
        run: |
          set -euo pipefail
          python3 quality/audit.py --evidence-dir quality/no-runtime-evidence --report quality/actual-vs-required.md
          test -s quality/actual-vs-required.md
          grep -q 'NOT_VERIFIED' quality/actual-vs-required.md
      - name: Run integration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Syntax check
        run: python3 -m py_compile scripts/apply_to_collabora.py scripts/make_icons.py tests/test_overlay.py
      - name: Validate real Android emulator and APK runtime test scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/emulator_preflight.sh
          bash -n scripts/run_android_smoke.sh
      - name: Compile and test offline document snapshot core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/history-classes
          javac -encoding UTF-8 -d build/history-classes \
            history/src/org/libreoffice/androidapp/ui/AquaWordHistory.java \
            history/test/org/libreoffice/androidapp/ui/AquaWordHistoryTest.java
          java -cp build/history-classes org.libreoffice.androidapp.ui.AquaWordHistoryTest
      - name: Upload required-vs-verified audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AquaWord-Requirements-Audit
          path: quality/actual-vs-required.md
          if-no-files-found: warn
          retention-days: 1
      - name: Verify five launcher icons
        shell: bash
        run: |
          set -euo pipefail
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "branding/icons/mipmap-$d/aquaword_launcher.png"
          done

      - name: Smoke-test pinned real Collabora source layout
        shell: bash
        run: |
          set -euo pipefail
          PIN=2333344185931274f9c49d6c12a408cefcef6844
          mkdir -p upstream-fixture/engine
          for file in browser/css/notebookbar.css browser/css/mobilewizard.css android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/appSettings.gradle.in android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java android/app/src/main/res/menu/view_menu.xml android/app/src/main/res/values/strings.xml browser/src/main.js browser/css/toolbar.css android/app/src/main/java/org/libreoffice/androidapp/ui/FileUtilities.java android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java; do
            mkdir -p "upstream-fixture/$(dirname "$file")"
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/CollaboraOnline/online.mirror/$PIN/$file" \
              --output "upstream-fixture/$file"
            test -s "upstream-fixture/$file"
          done
          python3 scripts/apply_to_collabora.py --repo upstream-fixture --phase source
          node --check upstream-fixture/browser/src/main.js
          grep -q 'AQUAWORD_DEFAULT_DOCX' upstream-fixture/android/app/src/main/java/org/libreoffice/androidapp/ui/FileUtilities.java
          grep -q 'AQUAWORD_PERIODIC_NATIVE_AUTOSAVE' upstream-fixture/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -q 'AQUAWORD_FOCUS_CSS_BEGIN' upstream-fixture/browser/css/toolbar.css
          python3 scripts/apply_templates.py --repo upstream-fixture
          python3 scripts/apply_templates.py --repo upstream-fixture
          test -s upstream-fixture/android/app/src/main/assets/aquaword/clinical_case.docx
          grep -q 'AQUAWORD_TEMPLATES_V1' upstream-fixture/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_AURORA_BEGIN' upstream-fixture/browser/css/notebookbar.css
          grep -Fq "applicationId 'com.aquaword.app'" upstream-fixture/android/app/appSettings.gradle.in
          python3 -m pip install 'javalang==0.13.0'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import javalang
          root=Path('upstream-fixture/android/app/src/main')
          for file in [
              root/'java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java',
              root/'java/org/libreoffice/androidapp/ui/AquaWordHistory.java',
              Path('upstream-fixture/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java')
          ]:
              javalang.parse.parse(file.read_text(encoding='utf-8'))
              print('Java syntax valid:',file)
          for file in [root/'res/values/strings.xml',root/'res/values-ar/aquaword_strings.xml',root/'res/menu/view_menu.xml']:
              ET.parse(file)
              print('Android resource XML valid:',file)
          PY
          echo 'PASS: AquaWord integration applies cleanly to pinned upstream source files'

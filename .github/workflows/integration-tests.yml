name: AquaWord Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'history/**'
      - 'branding/**'
      - 'quality/**'
      - 'templates/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
  workflow_dispatch:

# Avoid obsolete CI runs; this project now uses free public-repository runners.
concurrency:
  group: aquaword-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overlay-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tool
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Generate AquaWord icons
        run: python3 scripts/make_icons.py
      - name: Create and validate four editable Word templates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'python-docx==1.2.0'
          python3 scripts/generate_templates.py
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from docx import Document
          paths=sorted(Path('templates/generated').glob('*.docx'))
          assert len(paths)==5, paths
          blank=Document('templates/generated/blank.docx')
          assert not any(p.text.strip() for p in blank.paragraphs)
          assert not blank.tables
          for path in paths:
              with ZipFile(path) as z:
                  assert z.testzip() is None
                  assert 'word/document.xml' in z.namelist()
              d=Document(path)
              if path.stem != 'blank':
                  assert len(d.paragraphs) >= 8, path
                  assert any(p.style.name.startswith('Heading') for p in d.paragraphs),path
              print(path, len(d.paragraphs), 'paragraphs')
          PY
      - name: Validate rich Arabic Word table-image-bidi source fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 quality/build_rich_fixture.py
          python3 quality/check_rich_docx.py
      - name: Real LibreOffice DOCX import and re-save roundtrip (not Android)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libreoffice-writer
          fi
          soffice --version
          python3 quality/template_roundtrip.py
      - name: Run native Android focus-mode behavior tests
        shell: bash
        run: |
          set -euo pipefail
          node --check branding/focus_mode.js
          node tests/test_focus_mode.cjs
      - name: Generate mandatory honest feature comparison report
        shell: bash
        run: |
          set -euo pipefail
          python3 quality/audit.py --evidence-dir quality/no-runtime-evidence --report quality/actual-vs-required.md
          test -s quality/actual-vs-required.md
          grep -q 'NOT_VERIFIED' quality/actual-vs-required.md
      - name: Run integration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Syntax check
        run: python3 -m py_compile scripts/apply_to_collabora.py scripts/make_icons.py tests/test_overlay.py
      - name: Validate real Android emulator and APK runtime test scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/emulator_preflight.sh
          bash -n scripts/run_android_smoke.sh
          bash -n scripts/publish_qa_draft.sh
      - name: Compile and test offline document snapshot core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/history-classes
          javac -encoding UTF-8 -d build/history-classes \
            history/src/org/libreoffice/androidapp/ui/AquaWordHistory.java \
            history/test/org/libreoffice/androidapp/ui/AquaWordHistoryTest.java
          java -cp build/history-classes org.libreoffice.androidapp.ui.AquaWordHistoryTest
      # Show acceptance report in the run itself; the account's
      # Actions artifact storage is full, so avoid upload-artifact entirely.
      - name: Attach acceptance matrix to GitHub run summary
        if: always()
        shell: bash
        run: |
          if test -f quality/actual-vs-required.md; then
            cat quality/actual-vs-required.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'AquaWord acceptance matrix could not be generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify five launcher icons
        shell: bash
        run: |
          set -euo pipefail
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "branding/icons/mipmap-$d/aquaword_launcher.png"
          done

      - name: Smoke-test pinned real Collabora source layout
        shell: bash
        run: |
          set -euo pipefail
          PIN=2333344185931274f9c49d6c12a408cefcef6844
          mkdir -p upstream-fixture/engine
          for file in browser/.stylelintrc.json browser/css/notebookbar.css browser/css/mobilewizard.css android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/appSettings.gradle.in android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java android/app/src/main/res/menu/view_menu.xml android/app/src/main/res/values/strings.xml browser/src/main.js browser/css/toolbar.css android/app/src/main/java/org/libreoffice/androidapp/ui/FileUtilities.java android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java; do
            mkdir -p "upstream-fixture/$(dirname "$file")"
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/CollaboraOnline/online.mirror/$PIN/$file" \
              --output "upstream-fixture/$file"
            test -s "upstream-fixture/$file"
          done
          python3 scripts/apply_to_collabora.py --repo upstream-fixture --phase source
          node --check upstream-fixture/browser/src/main.js
          # First reproduce the upstream file's exact ESLint indentation rule;
          # prevents a 3-hour native build from failing on Focus Mode tabs.
          npx --yes --package eslint@7.32.0 -- eslint --no-eslintrc --no-ignore \
            --env browser,es6 --parser-options '{"ecmaVersion":2017}' \
            --rule 'indent: [2, "tab", {"outerIIFEBody": 0}]' \
            --rule 'no-mixed-spaces-and-tabs: [2, "smart-tabs"]' \
            upstream-fixture/browser/src/main.js
          npx --yes --package stylelint@13.7.0 -- stylelint \
            --config upstream-fixture/browser/.stylelintrc.json \
            upstream-fixture/browser/css/notebookbar.css \
            upstream-fixture/browser/css/mobilewizard.css \
            upstream-fixture/browser/css/toolbar.css
          grep -q 'AQUAWORD_DEFAULT_DOCX' upstream-fixture/android/app/src/main/java/org/libreoffice/androidapp/ui/FileUtilities.java
          grep -q 'AQUAWORD_READONLY_DOCUMENT_GRANTS' upstream-fixture/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_PERIODIC_NATIVE_AUTOSAVE' upstream-fixture/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -q 'AQUAWORD_NATIVE_SAVE_CHECKPOINT' upstream-fixture/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -q 'AQUAWORD_FOCUS_CSS_BEGIN' upstream-fixture/browser/css/toolbar.css
          python3 scripts/apply_templates.py --repo upstream-fixture
          python3 scripts/apply_templates.py --repo upstream-fixture
          test -s upstream-fixture/android/app/src/main/assets/aquaword/clinical_case.docx
          test -s upstream-fixture/android/app/src/main/assets/aquaword/blank.docx
          grep -q 'AQUAWORD_VERIFIED_BLANK_DOCX' upstream-fixture/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_TEMPLATES_V1' upstream-fixture/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_PENDING_SAF_RECOVERY' upstream-fixture/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'persistDocumentPermission(destination, data);' upstream-fixture/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_AURORA_BEGIN' upstream-fixture/browser/css/notebookbar.css
          grep -Fq "applicationId 'com.aquaword.app'" upstream-fixture/android/app/appSettings.gradle.in
          python3 -m pip install 'javalang==0.13.0'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import javalang
          root=Path('upstream-fixture/android/app/src/main')
          for file in [
              root/'java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java',
              Path('upstream-fixture/android/lib/src/main/java/org/libreoffice/androidlib/AquaWordHistory.java'),
              Path('upstream-fixture/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java'),
              Path('upstream-fixture/android/app/src/debug/java/org/libreoffice/androidapp/qa/QaOpenDocumentActivity.java')
          ]:
              javalang.parse.parse(file.read_text(encoding='utf-8'))
              print('Java syntax valid:',file)
          for file in [root/'res/values/strings.xml',root/'res/values-ar/aquaword_strings.xml',
                       root/'res/menu/view_menu.xml',
                       Path('upstream-fixture/android/app/src/debug/AndroidManifest.xml'),
                       Path('upstream-fixture/android/app/src/debug/res/xml/aquaword_qa_file_paths.xml')]:
              ET.parse(file)
              print('Android resource XML valid:',file)
          PY
          echo 'PASS: AquaWord integration applies cleanly to pinned upstream source files'

name: AquaWord Native Android (Internal CI)

on:
  # Purpose-bound, one-shot diagnostic on this feature branch only.
  # Only an exact purpose-bound commit message and marker-path change may run.
  push:
    branches: [fix/saf-save-failure-recovery-20261023]
    paths: ['.github/native-diagnostic-once.request']
  workflow_dispatch:
    inputs:
      final_ready:
        description: 'Final source acceptance and independent recheck completed'
        required: true
        type: boolean
        default: false
      diagnostic_build:
        description: 'Manual internal diagnostic build; not a release'
        required: true
        type: boolean
        default: false
      diagnostic_reason:
        description: 'Specific integration question not answered by source tests'
        required: false
        type: string
        default: ''
      diagnostic_compile_only:
        description: 'Build and verify APK only; skip unsupported emulator, keep unpublished QA draft'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aquaword-native
  cancel-in-progress: false

jobs:
  native-debug:
    if: ${{ (((inputs.final_ready == true && inputs.diagnostic_build != true) || (inputs.diagnostic_build == true && inputs.final_ready != true && inputs.diagnostic_reason != '')) && !(inputs.diagnostic_compile_only == true && inputs.diagnostic_build != true)) || (github.event_name == 'push' && github.event.head_commit.message == 'AquaWordNativeDiagnosticRetryOnce') }}
    # One native build at a time; never cancel hours of native compilation on a push.
    # Heavy native builds are MANUAL only to avoid repeated hours-long runs on every workflow edit.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      UPSTREAM_SHA: 2333344185931274f9c49d6c12a408cefcef6844
      NDK_VERSION: 29.0.14206865
      ABI: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce final approval or explicit diagnostic-only authorization
        env:
          FINAL_READY: ${{ inputs.final_ready }}
          DIAGNOSTIC_BUILD: ${{ inputs.diagnostic_build }}
          DIAGNOSTIC_COMPILE_ONLY: ${{ inputs.diagnostic_compile_only }}
          DIAGNOSTIC_REASON: ${{ inputs.diagnostic_reason }}
          RUN_EVENT: ${{ github.event_name }}
          ONE_SHOT_REQUEST_MATCH: ${{ github.event.head_commit.message == 'AquaWordNativeDiagnosticRetryOnce' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FINAL_READY" = 'true' ] && [ "$DIAGNOSTIC_BUILD" != 'true' ] && [ "$DIAGNOSTIC_COMPILE_ONLY" != 'true' ]; then
            bash scripts/check_final_ready.sh
          elif [ "$RUN_EVENT" = 'push' ] && [ "$ONE_SHOT_REQUEST_MATCH" = 'true' ]; then
            echo 'INTERNAL ONE-SHOT DIAGNOSTIC: Does pinned Collabora/LibreOffice ARM64 compile and package the current AquaWord overlay into a verifiable APK?' >> "$GITHUB_STEP_SUMMARY"
            echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo 'Compile-only: yes. Android Writer/SAF device behavior remains NOT TESTED.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DIAGNOSTIC_BUILD" = 'true' ] && [ "$FINAL_READY" != 'true' ] && [ -n "${DIAGNOSTIC_REASON//[[:space:]]/}" ]; then
            echo "INTERNAL DIAGNOSTIC ONLY: $DIAGNOSTIC_REASON" >> "$GITHUB_STEP_SUMMARY"
            echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "Compile-only (no emulator certification): $DIAGNOSTIC_COMPILE_ONLY" >> "$GITHUB_STEP_SUMMARY"
            echo 'NOT FINAL-READY; device and release acceptance remain NOT TESTED.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Missing explicit authorization' >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The Ubuntu hosted runner already provides Android cmdline-tools.
      # android-actions/setup-android@v3 currently fails requesting retired SDK 'tools'.
      - name: Prepare integration files and run tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'Pillow==11.3.0' 'python-docx==1.2.0' 'lxml==6.0.2' 'polib==1.2.0'
          python3 scripts/make_icons.py
          python3 scripts/generate_templates.py
          python3 quality/build_rich_fixture.py
          python3 quality/check_rich_docx.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check available Linux resources
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h .
          echo 'Warning: the Collabora/LibreOffice native engine may exceed a standard GitHub runner disk/time allowance.'
      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             git ca-certificates autoconf automake libtool gettext pkg-config             g++ make cmake ninja-build python3 python3-lxml             python3-polib python3-setuptools gperf bison flex nasm             zip unzip rsync curl patch libxml2-utils libxml2-dev libxslt1-dev             zlib1g-dev libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev             libx11-dev libxext-dev libxrender-dev libxinerama-dev libxt-dev             libxrandr-dev libxdamage-dev libxfixes-dev libxft-dev libsm-dev             libice-dev libcups2-dev libdbus-1-dev libssl-dev libzstd-dev             libglib2.0-dev libkrb5-dev libpam0g-dev libcap-dev libcairo2-dev             libgtk-3-dev libnss3-dev libnspr4-dev libicu-dev             nodejs npm
      - name: Install matching Android components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' "ndk;$NDK_VERSION"
          test -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
      - name: Clone pinned Collabora monorepo
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/CollaboraOnline/online.mirror.git collabora
          git -C collabora -c advice.detachedHead=false checkout --detach "$UPSTREAM_SHA"
          test "$(git -C collabora rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -d collabora/engine
          test -d collabora/browser
          test -d collabora/android
          git -C collabora show -s --format='%H %cs %s' HEAD > upstream-version.txt
      - name: Apply AquaWord branding before native configure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_to_collabora.py --repo collabora --phase source
          python3 scripts/apply_templates.py --repo collabora
          node --check collabora/browser/src/main.js
          # Validate exactly the indentation that broke native CI run 39768833806.
          # Run BEFORE the ~hours-long LibreOffice ARM64 engine compilation.
          npx --yes --package eslint@7.32.0 -- eslint --no-eslintrc --no-ignore \
            --env browser,es6 --parser-options '{"ecmaVersion":2017}' \
            --rule 'indent: [2, "tab", {"outerIIFEBody": 0}]' \
            --rule 'no-mixed-spaces-and-tabs: [2, "smart-tabs"]' \
            collabora/browser/src/main.js
          # Pinned Collabora Stylelint check before multi-hour ARM64 compilation.
          # Run 39916261052 failed on notebookbar selector after engine succeeded.
          npx --yes --package stylelint@13.7.0 -- stylelint \
            --config collabora/browser/.stylelintrc.json \
            collabora/browser/css/notebookbar.css \
            collabora/browser/css/mobilewizard.css \
            collabora/browser/css/toolbar.css
          grep -q 'AQUAWORD_FOCUS_BOOTSTRAP_BEGIN' collabora/browser/src/main.js
          grep -q 'AQUAWORD_FOCUS_CSS_BEGIN' collabora/browser/css/toolbar.css
          grep -q 'AQUAWORD_DEFAULT_DOCX' collabora/android/app/src/main/java/org/libreoffice/androidapp/ui/FileUtilities.java
          test -s collabora/android/templates/untitled.docx
          grep -q 'AQUAWORD_ASYNC_DOCUMENT_CREATE' collabora/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_SAFE_SAF_PERMISSIONS' collabora/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_PERIODIC_NATIVE_AUTOSAVE' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -q 'AQUAWORD_NATIVE_SAVE_CHECKPOINT' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -q 'AQUAWORD_NATIVE_SAF_SAVE_BACK' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -q 'AQUAWORD_VERIFIED_ASYNC_EXPORT' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          # A native save must NEVER be acknowledged or snapshotted when the
          # actual Android document provider or resolved-file write fails.
          # These signatures must match the AquaWord serialized SAVE overlay,
          # not the old upstream void methods removed by the patch.
          # This preflight runs before any expensive native engine compilation.
          grep -Fq 'private boolean copyTempBackToIntent(java.io.File sourceFile, Uri destination, java.io.File resolvedAtSave)' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -Fq 'private boolean copyTempBackToFile(java.io.File sourceFile, java.io.File resolvedFile)' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -Fq 'copyTempBackToIntent(checkpoint.file, original, resolvedAtSave)' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -Fq 'AquaWordHistory.verifyProviderWriteback(checkpoint, providerReadback)' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          grep -q 'AquaWord SAVE not acknowledged' collabora/android/lib/src/main/java/org/libreoffice/androidlib/LOActivity.java
          git -C collabora diff --check
      - name: Check build interpreter dependencies before expensive compilation
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 - <<'PY'
          import sys
          import lxml.etree
          import polib
          print('Collabora configure Python:', sys.executable)
          print('lxml:', lxml.etree.LXML_VERSION)
          print('polib:', polib.__version__)
          PY
          command -v node
          command -v npm
          command -v javac
      - name: Validate real Collabora configure flags before expensive engine build
        shell: bash
        run: |
          set -euo pipefail
          cd collabora
          ./autogen.sh
          ./configure --help > /tmp/aquaword-collabora-configure-help.txt
          for flag in --enable-androidapp --with-lo-builddir --with-android-abi --with-app-name --with-app-package-name; do
            grep -F -- "$flag" /tmp/aquaword-collabora-configure-help.txt >/dev/null || {
              echo "Missing required Collabora configure option: $flag" >&2
              exit 1
            }
          done
          echo 'PASS: pinned Collabora source supports required AquaWord Android flags'
      # Independent of the exhausted Actions artifact quota: repositories
      # have a separate free Actions build cache, default 10 GB. The key
      # includes the immutable LO commit and pinned Android toolchain.
      # Preserve only LO build outputs, not the entire cloned source tree.
      - name: Restore LibreOffice ARM64 build cache
        id: engine_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            collabora/engine/workdir
            collabora/engine/instdir
            collabora/engine/android/jniLibs
          key: aqua-lo-arm64-ubuntu24-2333344185931274f9c49d6c12a408cefcef6844-ndk29.0.14206865-v2
          restore-keys: |
            aqua-lo-arm64-ubuntu24-2333344185931274f9c49d6c12a408cefcef6844-ndk29.0.14206865-v1
      - name: Build or safely reuse LibreOffice native ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          cd collabora/engine
          cat > autogen.input <<EOF
          --build=x86_64-unknown-linux-gnu
          --with-android-ndk=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          --with-android-sdk=$ANDROID_SDK_ROOT
          --with-distro=CPAndroidAarch64
          EOF
          ./autogen.sh
          # A previous cache stored workdir/instdir, including gbuild .done
          # markers, but NOT engine/android/jniLibs. The resulting Gradle
          # failure was a missing liblo-native-code.so, not a Java error.
          # Invalidate the two exact gbuild stamps if the real ELF is absent.
          python3 ../../scripts/native_engine_artifact.py prepare --engine-dir . --abi "$ABI"
          if [ "${{ steps.engine_cache.outputs.cache-hit }}" = "true" ] &&
             test -s instdir/program/setuprc &&
             test -s workdir/LinkTarget/StaticLibrary/liblibpng.a &&
             test -s "android/jniLibs/$ABI/liblo-native-code.so"; then
            echo "Reusing complete LO ARM64 engine and native shared object"
          else
            echo "Compiling/linking missing LibreOffice ARM64 engine outputs"
            make -j2
          fi
          test -s instdir/program/setuprc
          test -s workdir/LinkTarget/StaticLibrary/liblibpng.a
          python3 ../../scripts/native_engine_artifact.py verify --engine-dir . --abi "$ABI"
      - name: Cache successful LibreOffice engine for next internal build
        if: success() && steps.engine_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            collabora/engine/workdir
            collabora/engine/instdir
            collabora/engine/android/jniLibs
          key: aqua-lo-arm64-ubuntu24-2333344185931274f9c49d6c12a408cefcef6844-ndk29.0.14206865-v2
      - name: Configure and compile Collabora Android app sources
        shell: bash
        run: |
          set -euo pipefail
          cd collabora
          ./autogen.sh
          python3 -c 'import lxml.etree, polib'
          ./configure --enable-androidapp --disable-setcap --with-lo-builddir="$PWD/engine" --with-android-abi="$ABI" --with-app-name=AquaWord --with-app-package-name=com.aquaword.app
          cd ..
          python3 scripts/apply_to_collabora.py --repo collabora --phase postconfigure
          make -C collabora -j2
      - name: Build AquaWord APK with Gradle
        shell: bash
        run: |
          set -euo pipefail
          # Fail before Gradle/CMake if the engine cache is incomplete.
          python3 scripts/native_engine_artifact.py verify --engine-dir collabora/engine --abi "$ABI"
          cd collabora/android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify AquaWord native Android UI integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AQUAWORD_PREEDIT_COPY' collabora/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_ASYNC_DOCUMENT_CREATE' collabora/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_SAFE_SAF_PERMISSIONS' collabora/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_FOCUS_BOOTSTRAP_BEGIN' collabora/browser/src/main.js
          test -s collabora/android/lib/src/main/java/org/libreoffice/androidlib/AquaWordHistory.java
          test -s collabora/android/app/src/main/res/values-ar/aquaword_strings.xml
          test -s collabora/android/app/src/main/assets/aquaword/research_ar.docx
          test -s collabora/android/app/src/main/assets/aquaword/clinical_case.docx
          test -s collabora/android/app/src/main/assets/aquaword/blank.docx
          grep -q 'AQUAWORD_VERIFIED_BLANK_DOCX' collabora/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
          grep -q 'AQUAWORD_TEMPLATES_V1' collabora/android/app/src/main/java/org/libreoffice/androidapp/ui/LibreOfficeUIActivity.java
      - name: Verify Android artifact and package ID
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find collabora/android -type f -name '*debug*.apk' -print > output/apk-paths.txt
          test -s output/apk-paths.txt
          AAPT="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          test -x "$APKSIGNER"
          while IFS= read -r apk; do
            unzip -t "$apk" >/dev/null
            # Require the pinned ARM64 LibreOffice engine (exact bytes or identical
            # ELF loadable segments after Android Gradle debug-symbol stripping).
            # Unrelated .so, altered executable bytes and wrong ABI must fail.
            python3 scripts/verify_native_apk.py --apk "$apk" --engine-dir collabora/engine --abi "$ABI"
            signature_report="output/$(basename "$apk").signature.txt"
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "$signature_report"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$signature_report"
            grep -Fq 'Signer #1 certificate SHA-256 digest:' "$signature_report"
            "$AAPT" dump badging "$apk" | grep -q "package: name='com.aquaword.app.debug'"
            for template in research_en research_ar clinical_case study_notes blank; do
              unzip -p "$apk" "assets/aquaword/$template.docx" > "output/$template.package.docx"
              test -s "output/$template.package.docx"
              cmp -s "templates/generated/$template.docx" "output/$template.package.docx"
              rm -f "output/$template.package.docx"
            done
            cp "$apk" "output/AquaWord-$(basename "$apk")"
          done < output/apk-paths.txt
          (cd output && sha256sum -- *.apk > SHA256SUMS)
          cp upstream-version.txt output/
      # Prefer a one-day downloadable artifact for compile-only diagnostics.
      # If free artifact storage is exhausted, report that explicitly and never
      # turn a successful native build into a false compiler failure.
      - name: Record real APK metadata and source provenance
        shell: bash
        run: |
          set -euo pipefail
          echo '## AquaWord native APK build evidence' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned Collabora: \`$UPSTREAM_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat output/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
          for report in output/*.signature.txt; do
            test -s "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
          df -h . | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload compile-only native APK for short-lived download
        id: diagnostic_apk_artifact
        if: ${{ success() && (inputs.diagnostic_compile_only == true || (github.event_name == 'push' && github.event.head_commit.message == 'AquaWordNativeDiagnosticRetryOnce')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        continue-on-error: true
        with:
          name: aquaword-native-diagnostic-${{ github.sha }}
          path: |
            output/AquaWord-*.apk
            output/SHA256SUMS
            output/*.signature.txt
            output/upstream-version.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Report diagnostic artifact availability
        if: ${{ always() && (inputs.diagnostic_compile_only == true || (github.event_name == 'push' && github.event.head_commit.message == 'AquaWordNativeDiagnosticRetryOnce')) }}
        env:
          ARTIFACT_OUTCOME: ${{ steps.diagnostic_apk_artifact.outcome }}
          ARTIFACT_URL: ${{ steps.diagnostic_apk_artifact.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.diagnostic_apk_artifact.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s output/SHA256SUMS ]; then
            if [ "$ARTIFACT_OUTCOME" = "success" ] && [ -n "$ARTIFACT_URL" ]; then
              {
                echo '## Downloadable internal diagnostic APK (expires after 1 day)'
                echo "$ARTIFACT_URL"
                echo "Artifact ID: $ARTIFACT_ID"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo '## APK built and structurally verified, but artifact upload failed (likely quota/permission). No downloadable artifact was retained.' >> "$GITHUB_STEP_SUMMARY"
            fi
            cat output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## No structurally verified APK was produced; no download artifact exists.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify installation and Arabic DOCX on a real Android emulator
        if: ${{ !(inputs.diagnostic_build == true && inputs.diagnostic_compile_only == true) && !(github.event_name == 'push' && github.event.head_commit.message == 'AquaWordNativeDiagnosticRetryOnce') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash scripts/run_android_smoke.sh "$(find output -type f -name 'AquaWord-*.apk' -print -quit)" "$PWD/smoke-evidence"
      - name: Record runtime result without consuming Actions artifact storage
        if: always()
        shell: bash
        run: |
          if [ -s smoke-evidence/smoke-result.txt ]; then
            echo '## Android runtime evidence' >> "$GITHUB_STEP_SUMMARY"
            cat smoke-evidence/smoke-result.txt >> "$GITHUB_STEP_SUMMARY"
            if [ -s smoke-evidence/required-vs-actual.md ]; then
              cat smoke-evidence/required-vs-actual.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'Android runtime smoke not verified; no release is authorized.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Only after real Android edit-save-reopen succeeds, store as UNPUBLISHED
      # draft Release to avoid exhausted Actions artifact storage.
      - name: Preserve emulator-verified APK in an unpublished QA draft
        id: verified_qa_draft
        if: ${{ success() && !(inputs.diagnostic_build == true && inputs.diagnostic_compile_only == true) && !(github.event_name == 'push' && github.event.head_commit.message == 'AquaWordNativeDiagnosticRetryOnce') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_qa_draft.sh
      # A compile-only diagnostic already attempted short-lived artifact upload.
      # Do not make a second, known-permission-sensitive release API call there.
      - name: Retain valid compiled APK when emulator certification is blocked
        id: unverified_qa_draft
        if: ${{ failure() && hashFiles('output/SHA256SUMS') != '' && !(inputs.diagnostic_build == true && inputs.diagnostic_compile_only == true) && !(github.event_name == 'push' && github.event.head_commit.message == 'AquaWordNativeDiagnosticRetryOnce') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/SHA256SUMS; then
            bash scripts/publish_qa_draft.sh --unverified
          else
            echo 'No verified build output; not preserving an APK.'
          fi
      - name: Report QA draft persistence failure
        if: ${{ steps.verified_qa_draft.outcome == 'failure' }}
        shell: bash
        run: echo 'APK/runtime checks completed, but the unpublished QA draft could not be persisted; no release or user delivery is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report unverified draft persistence failure
        if: ${{ steps.unverified_qa_draft.outcome == 'failure' }}
        shell: bash
        run: echo 'The native APK was built but the unverified QA draft could not be persisted. Checksum evidence is in this run; no downloadable artifact is claimed.' >> "$GITHUB_STEP_SUMMARY"
      # Compile-only diagnostic success retains checksummed APK as UNVERIFIED,
      # never as an emulator-verified draft. No public release is created.
      # Publishing any internal draft is NOT a completed user-facing release.
      - name: Explain and preserve native build failure evidence in run summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## AquaWord native build failed — NO verified APK'
            echo ''
            echo "Source commit: \`$(git rev-parse HEAD)\`"
            echo "Upstream Collabora commit: \`$UPSTREAM_SHA\`"
            echo ''
            echo '### Runner storage at failure'
            df -h .
            echo ''
            echo '### Build filesystem footprint'
            if test -d collabora/engine; then du -sh collabora/engine || true; fi
            if test -d collabora/android; then du -sh collabora/android || true; fi
            echo ''
            echo '### APK candidates (not verified)'
            find collabora/android -type f -name '*.apk' -print 2>/dev/null || true
            echo ''
            echo 'Failed job steps and the full compiler error remain in the GitHub Actions logs. No artifact was labeled as a release.'
          } >> "$GITHUB_STEP_SUMMARY"


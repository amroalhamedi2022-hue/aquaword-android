name: AquaWord Android Emulator Preflight

# One-time proof that our private-repository GitHub runner can boot an
# Android 15 emulator before the expensive native APK build completes.
on:
  push:
    paths:
      - '.github/workflows/android-emulator-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Boot an actual Android 15 API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash scripts/emulator_preflight.sh
      - name: Keep actual emulator boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AquaWord-Emulator-Boot-Evidence
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 7
